name: CI Tests & Static Analysis

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} (Lint, Pint, PHPStan, PHPUnit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: find app bootstrap config database public routes tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check PSR-12 coding style (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Run PHPStan Level 8 static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Run PHPUnit automated test suite
        run: vendor/bin/phpunit --colors=always

  frontend-assets:
    name: Frontend Build & JS Module Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dev dependencies
        run: npm ci

      - name: Validate JS syntax & Tailwind CSS build
        run: npm run check

